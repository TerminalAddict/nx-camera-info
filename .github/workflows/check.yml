name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test cloud backup script (offline)
        run: python -B -m unittest discover -s scripts -p test_backup_cloud_sites.py -v
      - run: go vet ./...
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build and smoke test
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          binary="dist/nx-camera-info$(go env GOEXE)"
          go build -trimpath -ldflags='-s -w' -o "$binary" .
          "$binary" --version
          "$binary" --help
